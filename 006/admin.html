<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>006-电商订单管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root { --primary: #ef4444; --secondary: #f97316; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 260px; min-height: 100vh; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); position: fixed; left: 0; top: 0; border-right: 1px solid rgba(255,255,255,0.1); }
        .logo { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-icon { width: 45px; height: 45px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .logo-text { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 5px 15px; border-radius: 10px; cursor: pointer; color: #94a3b8; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; }
        .main-content { margin-left: 260px; padding: 20px 30px; }
        .stat-card { background: rgba(30,41,59,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
        .stat-value { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: rgba(30,41,59,0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; margin-bottom: 20px; }
        .card-header { background: transparent; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 16px 20px; font-weight: 600; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; border-radius: 10px; }
        .chart-container { position: relative; height: 300px; }
        .table { color: #f1f5f9; }
        .table th { border-color: rgba(255,255,255,0.1); }
        .table td { border-color: rgba(255,255,255,0.05); }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo d-flex align-items-center gap-3">
            <div class="logo-icon"><i class="bi bi-bag-check"></i></div>
            <div><div class="logo-text">电商订单管理</div><div style="font-size:11px;color:#64748b;">订单全流程管理</div></div>
        </div>
        <div style="padding:15px 0;">
            <div class="nav-item active" onclick="showSection('dashboard')"><i class="bi bi-grid-fill"></i><span>数据概览</span></div>
            <div class="nav-item" onclick="showSection('list')"><i class="bi bi-list-ul"></i><span>数据列表</span></div>
            <div class="nav-item" onclick="showSection('analytics')"><i class="bi bi-bar-chart"></i><span>数据分析</span></div>
            <div class="nav-item" onclick="showSection('settings')"><i class="bi bi-gear"></i><span>系统设置</span></div>
        </div>
    </div>
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 style="font-weight:700;" id="pageTitle">数据概览</h2>
            <div class="d-flex align-items-center gap-3"><button class="btn btn-primary"><i class="bi bi-plus-lg me-2"></i>新增</button><div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;"><i class="bi bi-person"></i></div></div>
        </div>
        <div id="dashboard" class="section">
            <div class="row">
                <div class="col-md-3"><div class="stat-card"><div class="stat-value">1,234</div><div style="color:#94a3b8;font-size:14px;">总数据</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-value">567</div><div style="color:#94a3b8;font-size:14px;">本月新增</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-value">89.5%</div><div style="color:#94a3b8;font-size:14px;">完成率</div></div></div>
                <div class="col-md-3"><div class="stat-card"><div class="stat-value">¥89,432</div><div style="color:#94a3b8;font-size:14px;">总金额</div></div></div>
            </div>
            <div class="row">
                <div class="col-md-8"><div class="card"><div class="card-header"><i class="bi bi-graph-up me-2"></i>趋势分析</div><div class="card-body"><div class="chart-container"><canvas id="mainChart"></canvas></div></div></div></div>
                <div class="col-md-4"><div class="card"><div class="card-header"><i class="bi bi-pie-chart me-2"></i>分类占比</div><div class="card-body"><div class="chart-container"><canvas id="pieChart"></canvas></div></div></div></div>
            </div>
        </div>
        <div id="list" class="section" style="display:none;">
            <div class="card"><div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                    <div class="d-flex gap-2"><input type="text" class="form-control" style="width:250px;background:rgba(15,23,42,0.5);border-color:rgba(255,255,255,0.1);color:#fff;" placeholder="搜索..."><select class="form-select" style="width:150px;background:rgba(15,23,42,0.5);border-color:rgba(255,255,255,0.1);color:#fff;"><option>全部状态</option></select></div>
                    <button class="btn btn-primary"><i class="bi bi-plus-lg me-2"></i>新增记录</button>
                </div>
                <table class="table table-hover">
                    <thead><tr><th>ID</th><th>名称</th><th>状态</th><th>金额</th><th>日期</th><th>操作</th></tr></thead>
                    <tbody>
                        <tr><td>#001</td><td>示例数据 A</td><td><span class="badge" style="background:rgba(16,185,129,0.2);color:#34d399;">正常</span></td><td>¥1,234.00</td><td>2024-01-15</td><td><button class="btn btn-sm btn-outline-secondary">查看</button></td></tr>
                        <tr><td>#002</td><td>示例数据 B</td><td><span class="badge" style="background:rgba(245,158,11,0.2);color:#fbbf24;">处理中</span></td><td>¥2,567.00</td><td>2024-01-14</td><td><button class="btn btn-sm btn-outline-secondary">查看</button></td></tr>
                        <tr><td>#003</td><td>示例数据 C</td><td><span class="badge" style="background:rgba(16,185,129,0.2);color:#34d399;">正常</span></td><td>¥3,890.00</td><td>2024-01-13</td><td><button class="btn btn-sm btn-outline-secondary">查看</button></td></tr>
                    </tbody>
                </table>
            </div></div>
        </div>
        <div id="analytics" class="section" style="display:none;"><div class="card"><div class="card-body"><h5>数据分析模块</h5><p class="text-muted">更多分析图表正在开发中...</p></div></div></div>
        <div id="settings" class="section" style="display:none;"><div class="card"><div class="card-body"><h5>系统设置</h5><p class="text-muted">配置项正在开发中...</p></div></div></div>
    </div>
    <script src="app.js"></script>
</body>
</html>

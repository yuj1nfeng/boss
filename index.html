<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧养殖系统 - 大规模水产养殖智能化管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #7c3aed;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #1a2332 50%, #0a0f1a 100%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .hero-section {
            padding: 80px 20px 60px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.3);
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .version-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .version-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 10px 40px rgba(37, 99, 235, 0.2);
        }

        .version-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .version-icon.desktop {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }

        .version-icon.mobile {
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
        }

        .version-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .version-desc {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .version-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .version-btn:hover {
            transform: scale(1.05);
        }

        .features {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-text {
            font-size: 15px;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-section">
            <div class="logo">
                <i class="bi bi-water"></i>
            </div>
            <h1 class="title">智慧养殖系统</h1>
            <p class="subtitle">大规模水产养殖智能化管理平台</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="version-card" onclick="location.href='admin.html'">
                    <div class="version-icon desktop">
                        <i class="bi bi-pc-display"></i>
                    </div>
                    <div class="version-title">PC管理后台</div>
                    <div class="version-desc">完整功能 · 数据大屏 · 系统配置</div>
                    <button class="version-btn">
                        <i class="bi bi-box-arrow-up-right me-2"></i>进入管理后台
                    </button>
                </div>
            </div>
            <div class="col-md-5">
                <div class="version-card" onclick="location.href='mobile.html'">
                    <div class="version-icon mobile">
                        <i class="bi bi-phone"></i>
                    </div>
                    <div class="version-title">移动端H5</div>
                    <div class="version-desc">手机适配 · 快捷操作 · 随时随地监控</div>
                    <button class="version-btn">
                        <i class="bi bi-box-arrow-up-right me-2"></i>进入移动端
                    </button>
                </div>
            </div>
        </div>

        <div class="features">
            <h3 class="text-center mb-4" style="color: #94a3b8; font-size: 16px;">平台核心功能</h3>
            <div class="feature-item">
                <div class="feature-icon" style="background: rgba(96, 165, 250, 0.2); color: #60a5fa;">
                    <i class="bi bi-droplet"></i>
                </div>
                <div class="feature-text">实时水质监测 · 溶解氧/pH/水温/氨氮 24小时监控</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon" style="background: rgba(52, 211, 153, 0.2); color: #34d399;">
                    <i class="bi bi-basket"></i>
                </div>
                <div class="feature-text">智能投喂系统 · 定时定量 · 一键投喂</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon" style="background: rgba(167, 139, 250, 0.2); color: #a78bfa;">
                    <i class="bi bi-fish"></i>
                </div>
                <div class="feature-text">全周期养殖管理 · 批次追踪 · 生长记录</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon" style="background: rgba(251, 191, 36, 0.2); color: #fbbf24;">
                    <i class="bi bi-shield-check"></i>
                </div>
                <div class="feature-text">AI病害预警 · 异常告警 · 远程设备控制</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon" style="background: rgba(239, 68, 68, 0.2); color: #ef4444;">
                    <i class="bi bi-graph-up"></i>
                </div>
                <div class="feature-text">数据分析报表 · 产量预测 · 成本收益分析</div>
            </div>
        </div>

        <div class="footer">
            <p>智慧养殖系统 v1.0 · 大规模水产养殖智能化解决方案</p>
            <p class="mt-2">
                <i class="bi bi-github me-1"></i>
                <a href="https://github.com/yuj1nfeng/boss" target="_blank" style="color: #64748b;">yuj1nfeng/boss</a>
            </p>
        </div>
    </div>
</body>
</html>
